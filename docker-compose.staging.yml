services:
  db:
    image: postgres:16-alpine
    container_name: cashcape-db-staging
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres-staging:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    image: ghcr.io/jogiri-dev/cashcape-backend:staging
    container_name: cashcape-backend-staging
    restart: always
    depends_on:
      - db
    environment:
      DB_DSN: ${DB_DSN}
      APIuser: ${APIuser}
      APIpassword: ${APIpassword}
    ports:
      - "8081:8080"

  frontend:
    image: ghcr.io/jogiri-dev/cashcape-frontend:staging
    container_name: cashcape-frontend-staging
    restart: always
    ports:
      - "5174:80"
