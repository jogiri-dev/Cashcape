name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./server
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/expense-backend:${{ steps.vars.outputs.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/expense-backend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./client
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/expense-frontend:${{ steps.vars.outputs.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/expense-frontend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-prod:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag backend as prod
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/expense-backend:prod \
            ghcr.io/${{ github.repository_owner }}/expense-backend:${{ needs.build.outputs.sha }}

      - name: Retag frontend as prod
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/expense-frontend:prod \
            ghcr.io/${{ github.repository_owner }}/expense-frontend:${{ needs.build.outputs.sha }}
