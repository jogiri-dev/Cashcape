services:
  db:
    image: postgres:16-alpine
    container_name: cashcape-db-prod
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres-prod:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: ghcr.io/jogiri-dev/cashcape-backend:prod
    container_name: cashcape-backend-prod
    restart: always
    depends_on:
      - db
    environment:
      DB_DSN: ${DB_DSN}
      APIuser: ${APIuser}
      APIpassword: ${APIpassword}
    ports:
      - "8080:8080"

  frontend:
    image: ghcr.io/jogiri-dev/cashcape-frontend:prod
    container_name: cashcape-frontend-prod
    restart: always
    ports:
      - "5173:80"
